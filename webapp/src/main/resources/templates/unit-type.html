<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'METIS / ' + ${unitType.unitTypeName}"></title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="shell">
    <a class="back-link" th:href="@{/factions/{id}(id=${unitType.factionId})}" th:text="'&lt;- ' + ${unitType.factionName}"></a>
    <section class="hero-panel compact-hero">
        <p class="eyebrow" th:text="|${unitType.gameName} / ${unitType.classificationName}|"></p>
        <h1 th:text="${unitType.unitTypeName}"></h1>
        <p class="lede" th:text="${unitType.unitTypeDescription}"></p>
    </section>

    <section class="section-heading"><div><p class="eyebrow">PROFILES</p><h2>Variants</h2></div><span class="count" th:text="${unitType.variants.size()}"></span></section>
    <section class="variant-stack">
        <article class="variant-card" th:each="variant : ${unitType.variants}">
            <div class="variant-heading"><div><span class="card-kicker">VARIANT</span><h3 th:text="${variant.name}"></h3><p th:text="${variant.description}"></p></div><span class="variant-id" th:text="'#' + ${variant.variantId}"></span></div>
            <div class="characteristic-grid" th:if="${!variant.characteristics.isEmpty()}">
                <div class="characteristic" th:each="characteristic : ${variant.characteristics}">
                    <span th:text="${characteristic.name}"></span><code th:text="${characteristic.data}"></code>
                </div>
            </div>
            <p class="muted" th:if="${variant.characteristics.isEmpty()}">No characteristic data recorded.</p>
        </article>
    </section>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
